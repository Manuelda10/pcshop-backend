services:

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:18-alpine
    container_name: pc-store-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auth_pass}
      POSTGRES_DB:       ${DB_NAME:-auth_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ejecuta las migraciones automáticamente al crear la DB por primera vez
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-auth_user} -d ${DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------
  # Auth Service
  # -------------------------
  auth-service:
    build:
      context: ../..                        # raíz del monorepo
      dockerfile: /Dockerfile  # path al Dockerfile desde la raíz
    container_name: pc-store-auth-service
    restart: unless-stopped
    env_file: .env                          # relativo a services/auth/ donde está el compose
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: